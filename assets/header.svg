<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Malik Zaeem Zulfiqar — Software Engineer and AI Builder</title>
<desc id="desc">Dark engineering-themed banner featuring animated AI graph and system architecture.</desc>
<defs>
