 <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#8190bd" stroke-width=".45" opacity=".18"/></pattern>
 <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}.node{fill:#091628;stroke:#4c8cbd;stroke-width:1.4}.wire{fill:none;stroke:#455578;stroke-width:1.4}.muted{fill:#8795b7}.glow{filter:url(#blur)}</style>
 <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1000" height="250" rx="14" fill="url(#back)"/><rect width="1000" height="250" rx="14" fill="url(#grid)"/>
